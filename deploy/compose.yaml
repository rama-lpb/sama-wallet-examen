name: sama-wallet-demo
services:
  db-wallet:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes: [wallet-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d wallet_db]
      interval: 5s
      retries: 20
  db-prestations:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes: [prestation-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d service_db]
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20
  wallet:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args: {SERVICE: wallet-service}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-wallet:5432/wallet_db
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Définir une clé aléatoire de 32 caractères minimum}
    depends_on:
      db-wallet: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
  prestations:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args: {SERVICE: service-app}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-prestations:5432/service_db
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_WALLET_BASE_URL: http://wallet:8091
      APP_JWT_SECRET: ${APP_JWT_SECRET}
    depends_on:
      db-prestations: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
  front:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports: ['127.0.0.1:8088:80']
    depends_on: [wallet, prestations]
    restart: unless-stopped
volumes:
  wallet-data:
  prestation-data:
